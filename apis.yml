aid: schwarz-charite-health-data
name: Schwarz Charite Health Data
description: >-
  Schwarz Charite Health Data GmbH is a German health-data joint venture announced on 2026-03-20 by
  Charite - Universitaetsmedizin Berlin and Schwarz Digits, the IT and digital arm of the Schwarz Group
  (Lidl, Kaufland, STACKIT). Schwarz Digits holds 75 percent and Charite 25 percent. The venture takes
  the HIVEPRO platform to market: a clinical data platform whose core is an openEHR-based Clinical Data
  Repository queried with Archetype Query Language (AQL), able to exchange data over HL7 FHIR - including
  the German Medical Informatics Initiative (MII) core dataset - and to feed OMOP-compliant analytics.
  HIVEPRO harmonises and networks records that are otherwise trapped in incompatible hospital source
  systems, and is delivered as a managed cloud service running on STACKIT's sovereign cloud so that data
  residency and control stay in Germany under European data-protection rules. The technical lineage comes
  from the BMBF-funded HiGHmed consortium, active since 2016. openEHR International lists the company as
  an industry partner. As of this pass the company has no website, developer portal, documentation host
  or public API of its own; every public surface it has is a press page on its parent's site.
